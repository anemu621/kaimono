    <!DOCTYPE html>
    <html lang="ja">
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="買い物リスト" />
    <meta name="theme-color" content="#9A82C7" />
    <title>買い物リスト</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
      :root { --purple:#9A82C7; --purple-dark:#6E56A0; --bg:#F6F2EA; }
      * { box-sizing: border-box; touch-action: manipulation; }
      html, body { margin: 0; padding: 0; }
      body {
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: contain;
        background: var(--bg);
        color: #3A3242;
        font-family: 'Noto Sans JP', sans-serif;
      }
      #app { min-height: 100vh; display: flex; flex-direction: column; position: relative; }
      .header { padding: 22px 18px 16px; background: #fff; border-bottom: 1px solid #EDE6D8; }
      .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
      .brand { display: flex; align-items: center; gap: 10px; }
      .brand-mark { width: 34px; height: 34px; border-radius: 8px; overflow: hidden; flex-shrink: 0; }
      .brand-mark img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .brand-text { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 1.5px; color: var(--purple-dark); }
      .count-label { font-size: 12px; color: #8A7F99; font-weight: 600; }
      .backup-row { display: flex; gap: 8px; }
      .backup-btn { flex: 1; text-align: center; padding: 8px 4px; border-radius: 8px; border: 1px solid #E4DCEF; background: #F8F5FC; color: var(--purple-dark); font-size: 11.5px; font-weight: 700; cursor: pointer; font-family: inherit; }
      .error-banner { margin: 10px 18px 0; padding: 8px 12px; background: #FBE4E4; border: 1px solid #F0A8A8; color: #B03535; font-size: 12px; border-radius: 8px; }
      .saved-banner { margin: 10px 18px 0; padding: 8px 12px; background: #E9F7EE; border: 1px solid #B6E3C5; color: #2E7D4F; font-size: 12px; border-radius: 8px; font-weight: 700; }
      .list { flex: 1; overflow-y: auto; padding: 16px 14px 100px; }
      .empty-state { text-align: center; color: #3A3242; padding: 60px 20px; display: flex; flex-direction: column; align-items: center; }
      .loading-state { text-align: center; color: #8A7F99; padding: 80px 20px; font-size: 13px; }
      .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .cat-card { background: #fff; border: 1px solid #EDE6D8; border-radius: 12px; padding: 12px; cursor: pointer; }
      .cat-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 13px; font-weight: 700; }
      .cat-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
      .item-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; cursor: pointer; }
      .item-move-row { display: flex; gap: 10px; justify-content: center; margin-top: 4px; }
      .item-move-btn { flex: 1; padding: 10px 0; border-radius: 8px; border: 1px solid #E4DCEF; background: #F8F5FC; color: var(--purple-dark); font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
      .item-move-btn:disabled { opacity: 0.35; }
      .delete-item-btn { margin-top: 10px; background: none; border: none; color: #C05656; font-size: 12.5px; text-decoration: underline; cursor: pointer; font-family: inherit; padding: 6px; display: block; margin-left: auto; margin-right: auto; }
      .item-check { width: 20px; height: 20px; border-radius: 50%; border: 2px solid; background: #fff; flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; }
      .item-check.checked { color: #fff; }
      .item-text { flex: 1; font-size: 13.5px; word-break: break-word; }
      .item-row.done .item-text { color: #C4BCCB; text-decoration: line-through; }
      .item-delete { background: none; border: none; padding: 2px; cursor: pointer; font-size: 12px; flex-shrink: 0; opacity: 0.5; }
      .fab { position: fixed; bottom: 24px; right: 20px; width: 56px; height: 56px; border-radius: 50%; background: var(--purple); border: none; box-shadow: 0 6px 16px rgba(154,130,199,0.5); display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; font-size: 26px; font-weight: 700; z-index: 20; }
      .list::-webkit-scrollbar { width: 6px; }
      .list::-webkit-scrollbar-thumb { background: #E4DCEF; border-radius: 3px; }
      button:active { transform: scale(0.97); }
      .modal-overlay { position: fixed; inset: 0; background: rgba(58,50,66,0.4); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
      .modal { background: #fff; border-top: 1px solid #EDE6D8; border-radius: 16px 16px 0 0; width: 100%; max-width: 480px; padding: 18px 18px 24px; display: flex; flex-direction: column; gap: 4px; max-height: 88vh; overflow-y: auto; }
      .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
      .modal-title { font-size: 17px; font-weight: 700; color: #3A3242; }
      .close-btn { background: none; border: none; cursor: pointer; padding: 4px; font-size: 14px; color: #8A7F99; }
      .cat-chip-row { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 12px; }
      .cat-chip { flex-shrink: 0; padding: 8px 16px; border-radius: 20px; border: 1.5px solid; background: #fff; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap; }
      .cat-chip.active { color: #fff; }
      label.field-label { font-size: 11.5px; color: #8A7F99; margin-top: 6px; margin-bottom: 5px; font-weight: 600; display: block; }
      .field-input { width: 100%; background: #F8F5FC; border: 1px solid #E4DCEF; border-radius: 8px; padding: 12px 14px; color: #3A3242; font-size: 14.5px; font-family: inherit; }
      .field-input:focus { outline: none; border-color: var(--purple); }
      .submit-btn { margin-top: 16px; background: var(--purple); color: #fff; border: none; border-radius: 10px; padding: 13px 0; font-size: 15px; font-weight: 700; cursor: pointer; width: 100%; font-family: inherit; }
      .submit-btn:disabled { opacity: 0.6; }
      .clear-done-btn { display: block; margin: 8px auto 0; background: none; border: none; color: #8A7F99; font-size: 12px; text-decoration: underline; cursor: pointer; font-family: inherit; padding: 6px; grid-column: 1 / -1; text-align: center; }
      .cat-editor { display: flex; flex-direction: column; gap: 8px; }
      .item-manage-row { display: flex; align-items: center; gap: 6px; background: #fff; border: 1px solid #EDE6D8; border-radius: 10px; padding: 10px 10px; }
      .item-manage-text { flex: 1; font-size: 14px; word-break: break-word; }
      .item-manage-text-input { flex: 1; font-size: 14px; border: none; border-bottom: 1.5px solid var(--purple); outline: none; padding: 2px 0; color: #3A3242; font-family: inherit; background: transparent; }
      .item-manage-row.done .item-manage-text { color: #C4BCCB; text-decoration: line-through; }
      .drag-handle { font-size: 15px; color: #B0A8BC; padding: 4px 6px; touch-action: none; cursor: grab; user-select: none; flex-shrink: 0; }
      .item-manage-row { transition: box-shadow 0.15s ease; }
      .item-manage-row.dragging { box-shadow: 0 6px 16px rgba(58,50,66,0.25); background: #FBF9FF; z-index: 10; position: relative; }
      .item-manage-icon { background: none; border: none; padding: 4px; cursor: pointer; font-size: 15px; flex-shrink: 0; }
      .manage-add-row { display: flex; gap: 8px; margin-top: 10px; }
      .manage-add-row input { flex: 1; background: #F8F5FC; border: 1px solid #E4DCEF; border-radius: 8px; padding: 10px 12px; font-size: 16px; font-family: inherit; -webkit-appearance: none; }
      .manage-add-row button { background: var(--purple); color: #fff; border: none; border-radius: 8px; padding: 0 18px; font-size: 18px; font-weight: 700; font-family: inherit; }
      .cat-edit-row { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #EDE6D8; border-radius: 10px; padding: 8px 10px; }
      .cat-move-btns { display: flex; flex-direction: column; gap: 1px; }
      .cat-move-btn { background: none; border: none; padding: 0; font-size: 10px; line-height: 1; color: #B0A8BC; cursor: pointer; }
      .cat-move-btn:disabled { opacity: 0.25; }
      .cat-dot-btn { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #E4DCEF; flex-shrink: 0; cursor: pointer; }
      .cat-name-input { flex: 1; border: none; border-bottom: 1px solid #E4DCEF; outline: none; font-size: 14px; padding: 4px 0; color: #3A3242; font-family: inherit; background: transparent; }
      .cat-name-input:focus { border-color: var(--purple); }
    </style>
    </head>
    <body>
    <div id="app"></div>

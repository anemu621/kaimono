name: Update cute shopping icon

on:
  push:
    paths:
      - '.github/workflows/update-cute-icon.yml'

permissions:
  contents: write

jobs:
  update-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace icon only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('shopping-list.html')
          s = p.read_text(encoding='utf-8')
          new_icon = 'data:image/svg+xml;charset=UTF-8,%3Csvg id%3D%22kaimono-icon-v3%22 xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22 viewBox%3D%220%200%20100%20100%22%3E%3Crect width%3D%22100%22 height%3D%22100%22 rx%3D%2222%22 fill%3D%22%23FFF0F5%22%2F%3E%3Cpath d%3D%22M29%2035h42l-4%2045H33z%22 fill%3D%22%2372C49C%22%2F%3E%3Cpath d%3D%22M36%2036c0-13%205-20%2014-20s14%207%2014%2020%22 fill%3D%22none%22 stroke%3D%22%234B9B79%22 stroke-width%3D%227%22 stroke-linecap%3D%22round%22%2F%3E%3Ccircle cx%3D%2244%22 cy%3D%2256%22 r%3D%223.5%22 fill%3D%22%23fff%22%2F%3E%3Ccircle cx%3D%2261%22 cy%3D%2256%22 r%3D%223.5%22 fill%3D%22%23fff%22%2F%3E%3Cpath d%3D%22M46%2066c3%203%2010%203%2013%200%22 fill%3D%22none%22 stroke%3D%22%23fff%22 stroke-width%3D%223.5%22 stroke-linecap%3D%22round%22%2F%3E%3Cpath d%3D%22M72%2025c0-5%207-8%2010-2%203-6%2010-3%2010%202%200%206-10%2011-10%2011S72%2031%2072%2025z%22 fill%3D%22%23F28FAF%22%2F%3E%3C%2Fsvg%3E'
          replacement = 'var ICON_DATA_URI = "' + new_icon + '";'
          s2, n = re.subn(r'var ICON_DATA_URI = "[^"]*";', replacement, s, count=1)
          if n != 1:
              raise SystemExit('ICON_DATA_URI not found exactly once')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shopping-list.html
          git rm .github/workflows/update-cute-icon.yml
          git commit -m "買い物リストのアイコンを可愛く変更"
          git push

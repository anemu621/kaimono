name: Fix shopping list storage separation

on:
  push:
    paths:
      - '.github/workflows/fix-storage-separation.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Use isolated shopping-list storage keys
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('shopping-list.html')
          s = p.read_text(encoding='utf-8')
          old_items = '"shopping-items"'
          old_cats = '"shopping-categories"'
          new_items = '"kaimono-shopping-items-v2"'
          new_cats = '"kaimono-shopping-categories-v2"'
          if old_items not in s or old_cats not in s:
              raise SystemExit('expected storage keys not found')
          s = s.replace(old_items, new_items)
          s = s.replace(old_cats, new_cats)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shopping-list.html
          git commit -m 'Separate shopping list storage from other app data'
          git push

# trigger storage separation

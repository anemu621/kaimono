name: Fix shopping-list icon cache

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix icon cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('shopping-list.html')
          s = p.read_text(encoding='utf-8')
          old = 'var ICON_DATA_URI = "data:image/svg+xml;charset=UTF-8,%3Csvg xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22'
          new = 'var ICON_DATA_URI = "data:image/svg+xml;charset=UTF-8,%3Csvg id%3D%22kaimono-icon-v2%22 xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22'
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shopping-list.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix shopping list icon cache'
          git push

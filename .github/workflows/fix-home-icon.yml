name: Fix iPhone home icon

on:
  push:
    paths:
      - '.github/workflows/fix-home-icon.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Replace home screen icon with a fresh PNG
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          data = base64.b64decode('')
          Path('apple-touch-icon-v5.png').write_bytes(data)
          PY
          sed -i 's/apple-touch-icon-v4\.svg/apple-touch-icon-v5.png/' shopping-list.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shopping-list.html apple-touch-icon-v5.png
          git commit -m 'Fix iPhone home screen icon cache'
          git push

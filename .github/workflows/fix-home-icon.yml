name: Fix home screen icon

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-icon:
    if: ${{ github.event.head_commit.message != 'fix: home screen icon png' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert icon SVG to PNG and update HTML
        run: |
          python -m pip install --disable-pip-version-check cairosvg
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='apple-touch-icon-v4.svg', write_to='apple-touch-icon-v5.png', output_width=180, output_height=180)
          PY
          python - <<'PY'
          from pathlib import Path
          p = Path('shopping-list.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<link rel="apple-touch-icon" href="apple-touch-icon-v4.svg" />', '<link rel="apple-touch-icon" href="apple-touch-icon-v5.png" />')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apple-touch-icon-v5.png shopping-list.html
          git commit -m 'fix: home screen icon png'
          git push

# trigger
